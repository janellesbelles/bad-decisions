<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1110"/><stop offset=".55" stop-color="#171020"/><stop offset="1" stop-color="#071b19"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ff4fbf" stop-opacity=".55"/><stop offset="1" stop-color="#ff4fbf" stop-opacity="0"/></radialGradient>
  <radialGradient id="cyan"><stop offset="0" stop-color="#8fffff" stop-opacity=".45"/><stop offset="1" stop-color="#8fffff" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1200" height="630" rx="34" fill="url(#bg)"/>
<circle cx="890" cy="220" r="330" fill="url(#glow)"/><circle cx="280" cy="500" r="300" fill="url(#cyan)"/>
<g opacity=".22" fill="#fff"><circle cx="86" cy="90" r="3"/><circle cx="1110" cy="94" r="2"/><circle cx="1030" cy="510" r="3"/><circle cx="750" cy="72" r="2"/><circle cx="480" cy="540" r="2"/></g>

<text x="70" y="125" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#99ffff" letter-spacing="4">POCKET GOAT PRESENTS</text>
<text x="65" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="92" font-weight="900" fill="#fff">BAD</text>
<text x="65" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="92" font-weight="900" fill="#ff63bd">DECISIONS</text>
<text x="70" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#eee">A chaotic card game for you + your AI companion.</text>
<text x="70" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#99ffff">MAKE TERRIBLE CHOICES TOGETHER.</text>

