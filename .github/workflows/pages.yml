name: Deploy Pocket Goat to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild game bundle
        run: cat chunks/game.js.part* > site/game.js
      - name: Build crisp social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert site/bad-decisions-social.jpg -filter Lanczos -resize 1200x630! -unsharp 0x0.8+0.8+0.02 -quality 92 site/bad-decisions-social-v2.jpg
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
