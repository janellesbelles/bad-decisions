name: Deploy Pocket Goat to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Pocket Goat
        run: |
          rm -rf dist
          mkdir dist
          unzip -q pocket-goat-v0.6.0.zip -d dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bad-decisions-web-v0.6.0-pocket-goat/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
